name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: a high or critical advisory in a delivery engine that holds
      # customer signing secrets is a release blocker, not a warning.
      - run: npm audit --omit=dev --audit-level=high

  production:
    name: Production startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start with production settings
        run: |
          SIGNALMESH_ENV=production \
          SIGNALMESH_DATA_FILE="$RUNNER_TEMP/signalmesh-ci.json" \
          SIGNALMESH_SECRET_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
          SIGNALMESH_API_KEY_PEPPER="$(openssl rand -hex 32)" \
            node src/server.js > "$RUNNER_TEMP/signalmesh-ci.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/signalmesh-ci.pid"
      - name: Wait for healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          echo "production process never became healthy"
          exit 1
      - name: Stop process and show logs
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signalmesh-ci.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/signalmesh-ci.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/signalmesh-ci.log" 2>/dev/null || true
