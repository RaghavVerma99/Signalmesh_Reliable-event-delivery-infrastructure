name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev
        continue-on-error: true

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signalmesh
          POSTGRES_USER: signalmesh
          POSTGRES_PASSWORD: signalmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalmesh -d signalmesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SIGNALMESH_TEST_PG_URL: postgres://signalmesh:signalmesh@localhost:5432/signalmesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: signalmesh:ci
