name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: a high or critical advisory in a delivery engine that holds
      # customer signing secrets is a release blocker, not a warning.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: signalmesh:ci
      - name: Start production container
        run: |
          docker run -d --name signalmesh-ci -p 8080:8080 \
            -e SIGNALMESH_ENV=production \
            -e SIGNALMESH_SECRET_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -e SIGNALMESH_API_KEY_PEPPER="$(openssl rand -hex 32)" \
            signalmesh:ci
      - name: Wait for healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          echo "container never became healthy"
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs signalmesh-ci
